<div class="enfant">
    <h4>AJOUTER UN ARTICLE</h4>
    <div>
        <label for="newArticle">Article à ajouter : </label>
        <input type="text" [(ngModel)]="newArticle.name">
        <input type="number" [(ngModel)]="newArticle.quantity">
        <button (click)="onClickAjouter(newArticle)">Ajouter à la liste</button>
    </div>
</div>
