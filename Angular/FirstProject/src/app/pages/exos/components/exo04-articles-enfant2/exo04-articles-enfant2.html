<h2>Liste des articles</h2>

<div>
    <div>
        @if(articles() && articles()!.length > 0){    
        @for(article of articles() ; track article){
            
        <p>{{article.name}} - {{article.quantity}}
        <button (click)="onClickRemoveArticle(article)">🗑️</button>
        <button (click)="onClickMinus(article)"> - </button>
        <button (click)="onClickPlus(article)"> + </button>
    </p>

        }}
        @else {
            <p>Pas d'articles</p>
        }
    </div>
